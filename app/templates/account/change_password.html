{% extends "base.html" %}
{% block title %}Change Password - RedOps Vault{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        {% if user.needs_password_change() %}
        <div class="alert alert-warning">Your password was reset by an admin. Set a new password to continue.</div>
        {% endif %}
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4 mb-3">Change Password</h1>
                <form method="post" action="{{ url_for('account.change_password') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
                    <div class="mb-3">
                        <label for="current_password" class="form-label">Current password</label>
                        <input type="password" class="form-control" id="current_password" name="current_password" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">New password</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" minlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm new password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="8" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
