services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-redops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redops}
      POSTGRES_DB: ${POSTGRES_DB:-redops_vault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redops} -d ${POSTGRES_DB:-redops_vault}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
