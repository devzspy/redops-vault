name: Bug report
description: Something in RedOps Vault isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. If it's a security vulnerability, stop — use the private reporting link instead (see SECURITY.md).
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What you did, and what you expected to happen instead.
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Server console output, a browser console error, or a screenshot. This will be rendered as-is, so no need for backticks around log blocks.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse HEAD` in your checkout, or the Docker image tag.
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: How are you running it?
      options:
        - Docker Compose
        - Local venv + Postgres
        - Other / not sure
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find this already reported.
          required: true
